version: '3.8'

services:
  nclex-practice:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for persistent database storage
      - ./data:/app/data
      # Mount database file if it exists
      - ./data_loader/nclex_simple.db:/app/nclex_simple.db:ro
    environment:
      - PORT=8000
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - nclex-practice
  #   restart: unless-stopped

volumes:
  data:
    driver: local